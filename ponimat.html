<body>
<div class="app">
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Разделы">
  <button class="tab" data-go="home" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4z" /><path d="M20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z" /></svg>
