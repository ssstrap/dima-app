<body>
<div class="app">
  <header class="hero">
    <div class="brand">
      <div class="logo">дима <span>в курсе</span></div>
      <div class="hero-date" id="heroDate"></div>
    </div>
    <div class="stats">
      <div class="stat stat-main">
        <div class="stat-num" id="ttFollowers">—</div>
        <div class="stat-label">подписчиков в TikTok</div>
        <div class="stat-sub" id="ttNet"></div>
      </div>
      <div class="stat stat-side">
        <div class="stat-num small" id="tgFollowers">—</div>
        <div class="stat-label">в Telegram</div>
      </div>
    </div>
    <div class="goal" id="goal"></div>
  </header>

  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Разделы">
  <button class="tab" data-tab="tasks" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 4-4" /><path d="M13 7h7" /><path d="m4 16 2 2 4-4" /><path d="M13 16h7" /></svg>
    <span>Задачи</span>
  </button>
  <button class="tab" data-tab="inspo" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.4 5.2L20 9l-4.2 3.8L17 18.5 12 15.6 7 18.5l1.2-5.7L4 9l5.6-.8z" /></svg>
    <span>Вдохновение</span>
  </button>
  <button class="tab" data-tab="tiktok" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v10.5a3.5 3.5 0 1 1-3.5-3.5" /><path d="M14 3c.4 2.6 2.2 4.4 5 4.6" /></svg>
    <span>Видео</span>
  </button>
  <button class="tab" data-tab="ads" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10H4z" /><path d="M17 9a4 4 0 0 1 0 6" /></svg>
    <span>Реклама</span>
  </button>
  <button class="tab" data-tab="tg" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 5 4 2-15z" /><path d="m9 13 8-6" /></svg>
    <span>ТГ</span>
  </button>
  <a class="tab" href="ponimat.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg>
    <span>Она</span>
  </a>
</nav>

<div class="toast" id="toast" role="status"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box">
    <div class="sheet-title">Скопируй вручную</div>
    <textarea id="sheetText" readonly></textarea>
    <button class="btn primary wide" id="sheetClose" type="button">готово</button>
  </div>
</div>
